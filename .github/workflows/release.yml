name: Release Plugin

# Triggered on version tags (e.g. 1.0.0, 1.0.1)
on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Attest & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile plugin bundle
        run: npm run build

      - name: Package plugin zip
        run: |
          files="main.js manifest.json"
          [ -f styles.css ] && files="$files styles.css"
          # shellcheck disable=SC2086
          zip -j "onyx-sync-${GITHUB_REF_NAME}.zip" $files
          unzip -l "onyx-sync-${GITHUB_REF_NAME}.zip"

      - name: Generate cryptographic artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            onyx-sync-*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            onyx-sync-*.zip
